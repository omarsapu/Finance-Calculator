<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Калькулятор — финансовый дашборд</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #131a22;
    --surface: #1b2430;
    --surface-2: #212b38;
    --ink: #eae6db;
    --muted: #8a96a6;
    --line: rgba(234,230,219,0.09);
    --accent: #33a879;
    --accent-soft: rgba(51,168,121,0.14);
    --gold: #d3a75c;
    --gold-soft: rgba(211,167,92,0.15);
    --expense: #c1654b;
    --radius: 14px;
    --serif: 'Source Serif 4', Georgia, serif;
    --sans: 'Inter', -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    max-width: 100%;
    overflow-x: hidden;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.4;
  }

  button, input, select { font-family: inherit; }
  button { cursor: pointer; }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- Layout shell ---------- */

  .app {
    display: grid;
    grid-template-columns: 260px 1fr;
    min-height: 100vh;
  }

  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--line);
    padding: clamp(20px, 2vw, 32px) 20px;
    display: flex;
    flex-direction: column;
    gap: 32px;
    position: sticky;
    top: 0;
    height: 100vh;
    z-index: 20;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .brand-mark {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

  .brand-name {
    font-family: var(--serif);
    font-size: 1.3rem;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  .nav {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 10px;
    color: var(--muted);
    text-decoration: none;
    font-size: 0.92rem;
    font-weight: 500;
    background: transparent;
    border: none;
    width: 100%;
    text-align: left;
  }

  .nav-item svg { flex-shrink: 0; opacity: 0.8; }

  .nav-item.active {
    background: var(--accent-soft);
    color: var(--ink);
  }

  .nav-item.active svg { opacity: 1; }

  .nav-item:hover { color: var(--ink); }

  .nav-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .sidebar-foot {
    margin-top: auto;
    font-size: 0.78rem;
    color: var(--muted);
    border-top: 1px solid var(--line);
    padding-top: 16px;
  }

  .scrim {
    display: none;
  }

  .main {
    min-width: 0;
    padding: clamp(18px, 3vw, 40px);
    display: flex;
    flex-direction: column;
    gap: clamp(20px, 2.5vw, 32px);
  }

  .topbar {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .hamburger {
    display: none;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--ink);
    width: 40px;
    height: 40px;
    border-radius: 10px;
    font-size: 1.1rem;
    flex-shrink: 0;
  }

  .topbar h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(1.3rem, 1.1rem + 0.8vw, 1.7rem);
    margin: 0;
  }

  .topbar .date {
    margin-left: auto;
    color: var(--muted);
    font-size: 0.85rem;
    white-space: nowrap;
  }

  /* ---------- Stats ---------- */

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(12px, 1.5vw, 20px);
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: clamp(16px, 2vw, 24px);
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
  }

  .stat-label {
    font-size: 0.82rem;
    color: var(--muted);
  }

  .stat-value {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(1.4rem, 1.1rem + 1.4vw, 2.1rem);
    font-variant-numeric: tabular-nums;
    word-break: break-word;
  }

  .stat-card.income .stat-value { color: var(--accent); }
  .stat-card.savings .stat-value { color: var(--gold); }

  /* ---------- Dashboard grid ---------- */

  .dashboard-grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: clamp(14px, 1.8vw, 24px);
    align-items: start;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: clamp(16px, 2vw, 24px);
    min-width: 0;
  }

  .panel + .panel { margin-top: clamp(14px, 1.8vw, 24px); }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }

  .panel-header h2 {
    font-family: var(--serif);
    font-size: 1.1rem;
    font-weight: 600;
    margin: 0;
  }

  .btn-add {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 0.82rem;
    font-weight: 500;
    white-space: nowrap;
  }

  .btn-add:hover { border-color: var(--accent); color: var(--accent); }

  /* Accounts ledger */

  .account-list, .history-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .account-row, .history-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }

  .account-row:last-child, .history-row:last-child { border-bottom: none; }

  .row-main {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
    flex: 1;
  }

  .row-title {
    font-size: 0.94rem;
    font-weight: 500;
    overflow-wrap: anywhere;
  }

  .row-sub {
    font-size: 0.78rem;
    color: var(--muted);
  }

  .row-amount {
    font-family: var(--serif);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    font-size: 1rem;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .row-amount.expense { color: var(--expense); }
  .row-amount.income { color: var(--accent); }

  .row-delete {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 1rem;
    padding: 4px 6px;
    flex-shrink: 0;
    border-radius: 6px;
  }

  .row-delete:hover { color: var(--expense); }

  .empty-note {
    color: var(--muted);
    font-size: 0.85rem;
    padding: 14px 0;
  }

  /* Piggy bank panel */

  .piggy-panel {
    display: flex;
    flex-direction: column;
    gap: 16px;
    background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%);
  }

  .piggy-panel h2 {
    font-family: var(--serif);
    font-size: 1.1rem;
    font-weight: 600;
    margin: 0;
  }

  .piggy-track {
    height: 14px;
    border-radius: 999px;
    background: var(--gold-soft);
    overflow: hidden;
  }

  .piggy-fill {
    height: 100%;
    border-radius: 999px;
    background: var(--gold);
    width: 0%;
    transition: width 0.6s ease;
  }

  .piggy-numbers {
    font-family: var(--serif);
    font-size: clamp(1.2rem, 1rem + 1vw, 1.6rem);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .piggy-numbers .goal { color: var(--muted); font-weight: 400; }

  .piggy-percent {
    color: var(--gold);
    font-size: 0.85rem;
    font-weight: 600;
  }

  .btn-primary {
    background: var(--gold);
    color: #1a1206;
    border: none;
    border-radius: 10px;
    padding: 12px 16px;
    font-weight: 600;
    font-size: 0.92rem;
    margin-top: 4px;
  }

  .btn-primary:hover { filter: brightness(1.08); }

  /* ---------- Forms (inline, inside modal) ---------- */

  .form-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 14px;
  }

  .form-field label {
    font-size: 0.8rem;
    color: var(--muted);
  }

  .form-field input, .form-field select {
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.95rem;
    width: 100%;
  }

  .form-field input:focus, .form-field select:focus {
    border-color: var(--accent);
  }

  .form-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 18px;
  }

  .btn-ghost {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 0.9rem;
  }

  .btn-submit {
    background: var(--accent);
    color: #0b1710;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-weight: 600;
    font-size: 0.9rem;
  }

  /* ---------- Modal ---------- */

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(9, 12, 16, 0.6);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: clamp(18px, 3vw, 26px);
    width: 100%;
    max-width: 380px;
    max-height: calc(100vh - 40px);
    overflow-y: auto;
  }

  .modal h3 {
    font-family: var(--serif);
    margin: 0 0 16px;
    font-size: 1.15rem;
  }

  /* ---------- Responsive: Laptop 992-1199 ---------- */

  @media (max-width: 1199px) {
    .app { grid-template-columns: 220px 1fr; }
  }

  /* ---------- Responsive: Tablet 768-991 ---------- */

  @media (max-width: 991px) {
    .app { grid-template-columns: 72px 1fr; }
    .brand-name, .nav-label, .sidebar-foot { display: none; }
    .sidebar { align-items: center; padding: 20px 12px; }
    .nav-item { justify-content: center; padding: 12px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .dashboard-grid { grid-template-columns: 1fr; }
    .panel + .panel { margin-top: 0; }
    .dashboard-grid > *:not(:last-child) { margin-bottom: clamp(14px, 1.8vw, 24px); }
  }

  /* ---------- Responsive: Mobile <=767 ---------- */

  @media (max-width: 767px) {
    .app { grid-template-columns: 1fr; }

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: min(260px, 80vw);
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      align-items: stretch;
      padding: 20px;
    }

    .sidebar.open { transform: translateX(0); }
    .sidebar.open .brand-name,
    .sidebar.open .nav-label,
    .sidebar.open .sidebar-foot { display: block; }
    .sidebar.open .nav-item { justify-content: flex-start; }

    .scrim.open {
      display: block;
      position: fixed;
      inset: 0;
      background: rgba(9,12,16,0.55);
      z-index: 15;
    }

    .hamburger { display: inline-flex; align-items: center; justify-content: center; }

    .stats { grid-template-columns: 1fr; }
    .topbar .date { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .sidebar, .piggy-fill { transition: none; }
  }
</style>
</head>
<body>

<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-name">Калькулятор</span>
    </div>
    <nav class="nav">
      <button class="nav-item active" title="Дашборд">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="12" width="8" height="9" rx="2"/><rect x="3" y="14" width="8" height="7" rx="2"/></svg>
        <span class="nav-label">Дашборд</span>
      </button>
      <button class="nav-item" title="Счета">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
        <span class="nav-label">Счета</span>
      </button>
      <button class="nav-item" title="История">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        <span class="nav-label">История</span>
      </button>
      <button class="nav-item" title="Настройки">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.55V21a2 2 0 11-4 0v-.09a1.7 1.7 0 00-1-1.55 1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.7 1.7 0 004.6 15a1.7 1.7 0 00-1.55-1H3a2 2 0 110-4h.09A1.7 1.7 0 004.6 9a1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06A1.7 1.7 0 009 4.6a1.7 1.7 0 001-1.55V3a2 2 0 114 0v.09a1.7 1.7 0 001 1.55 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06A1.7 1.7 0 0019.4 9a1.7 1.7 0 001.55 1H21a2 2 0 110 4h-.09a1.7 1.7 0 00-1.55 1z"/></svg>
        <span class="nav-label">Настройки</span>
      </button>
    </nav>
    <div class="sidebar-foot">Личные финансы · обновлено сегодня</div>
  </aside>

  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Открыть меню">☰</button>
      <h1>Дашборд</h1>
      <span class="date" id="dateLabel"></span>
    </header>

    <section class="stats">
      <div class="stat-card">
        <span class="stat-label">Общий баланс</span>
        <span class="stat-value" id="totalBalance">0 ₽</span>
      </div>
      <div class="stat-card income">
        <span class="stat-label">Доход</span>
        <span class="stat-value" id="totalIncome">0 ₽</span>
      </div>
      <div class="stat-card savings">
        <span class="stat-label">Накоплено</span>
        <span class="stat-value" id="totalSavings">0 ₽</span>
      </div>
    </section>

    <section class="dashboard-grid">
      <div>
        <div class="panel accounts-panel">
          <div class="panel-header">
            <h2>Мои счета</h2>
            <button class="btn-add" id="openAddAccount">+ Добавить счёт</button>
          </div>
          <ul class="account-list" id="accountList"></ul>
        </div>

        <div class="panel history-panel">
          <div class="panel-header">
            <h2>История операций</h2>
            <button class="btn-add" id="openAddTx">+ Операция</button>
          </div>
          <ul class="history-list" id="historyList"></ul>
        </div>
      </div>

      <div class="panel piggy-panel">
        <h2>Копилка</h2>
        <div class="piggy-track">
          <div class="piggy-fill" id="piggyFill"></div>
        </div>
        <div class="piggy-numbers">
          <span id="piggyCurrent">0</span> <span class="goal">/ <span id="piggyGoal">0</span> ₽</span>
        </div>
        <span class="piggy-percent" id="piggyPercent">0%</span>
        <button class="btn-primary" id="openPiggy">Пополнить копилку</button>
      </div>
    </section>
  </main>

</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal"></div>
</div>

<script>
  "use strict";

  // ---------- State ----------

  const state = {
    accounts: [
      { id: 1, name: "Основной", balance: 80000 },
      { id: 2, name: "Накопления", balance: 25000 }
    ],
    transactions: [
      { id: 1, type: "income", amount: 80000, desc: "Зарплата", date: "01.09" },
      { id: 2, type: "expense", amount: 12000, desc: "Продукты", date: "03.09" }
    ],
    piggy: { current: 250000, goal: 500000 }
  };

  let nextAccountId = 3;
  let nextTxId = 3;

  // ---------- Helpers ----------

  const formatMoney = (n) => n.toLocaleString("ru-RU") + " ₽";

  const totalBalance = () => state.accounts.reduce((sum, a) => sum + a.balance, 0);
  const totalIncome = () => state.transactions.filter(t => t.type === "income").reduce((s, t) => s + t.amount, 0);

  // ---------- Render ----------

  function render() {
    document.getElementById("totalBalance").textContent = formatMoney(totalBalance());
    document.getElementById("totalIncome").textContent = formatMoney(totalIncome());
    document.getElementById("totalSavings").textContent = formatMoney(state.piggy.current);

    const accountList = document.getElementById("accountList");
    accountList.innerHTML = "";
    if (state.accounts.length === 0) {
      accountList.innerHTML = '<li class="empty-note">Пока нет счетов</li>';
    } else {
      state.accounts.forEach(acc => {
        const li = document.createElement("li");
        li.className = "account-row";
        li.innerHTML = `
          <div class="row-main">
            <span class="row-title">${escapeHtml(acc.name)}</span>
            <span class="row-sub">Счёт</span>
          </div>
          <span class="row-amount">${formatMoney(acc.balance)}</span>
          <button class="row-delete" aria-label="Удалить счёт" data-id="${acc.id}">✕</button>
        `;
        li.querySelector(".row-delete").addEventListener("click", () => {
          state.accounts = state.accounts.filter(a => a.id !== acc.id);
          render();
        });
        accountList.appendChild(li);
      });
    }

    const historyList = document.getElementById("historyList");
    historyList.innerHTML = "";
    if (state.transactions.length === 0) {
      historyList.innerHTML = '<li class="empty-note">Операций пока нет</li>';
    } else {
      [...state.transactions].reverse().forEach(tx => {
        const li = document.createElement("li");
        li.className = "history-row";
        const sign = tx.type === "income" ? "+" : "−";
        li.innerHTML = `
          <div class="row-main">
            <span class="row-title">${escapeHtml(tx.desc)}</span>
            <span class="row-sub">${tx.date}</span>
          </div>
          <span class="row-amount ${tx.type}">${sign} ${formatMoney(tx.amount)}</span>
        `;
        historyList.appendChild(li);
      });
    }

    const pct = Math.min(100, Math.round((state.piggy.current / state.piggy.goal) * 100));
    document.getElementById("piggyFill").style.width = pct + "%";
    document.getElementById("piggyCurrent").textContent = state.piggy.current.toLocaleString("ru-RU");
    document.getElementById("piggyGoal").textContent = state.piggy.goal.toLocaleString("ru-RU");
    document.getElementById("piggyPercent").textContent = pct + "%";
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  // ---------- Date label ----------

  document.getElementById("dateLabel").textContent = new Date().toLocaleDateString("ru-RU", {
    day: "numeric", month: "long", year: "numeric"
  });

  // ---------- Mobile sidebar ----------

  const sidebar = document.getElementById("sidebar");
  const scrim = document.getElementById("scrim");
  const hamburger = document.getElementById("hamburger");

  function closeSidebar() {
    sidebar.classList.remove("open");
    scrim.classList.remove("open");
  }

  hamburger.addEventListener("click", () => {
    sidebar.classList.toggle("open");
    scrim.classList.toggle("open");
  });
  scrim.addEventListener("click", closeSidebar);

  // ---------- Modal ----------

  const modalOverlay = document.getElementById("modalOverlay");
  const modal = document.getElementById("modal");

  function openModal(html, onMount) {
    modal.innerHTML = html;
    modalOverlay.classList.add("open");
    if (onMount) onMount(modal);
  }

  function closeModal() {
    modalOverlay.classList.remove("open");
    modal.innerHTML = "";
  }

  modalOverlay.addEventListener("click", (e) => {
    if (e.target === modalOverlay) closeModal();
  });

  document.getElementById("openAddAccount").addEventListener("click", () => {
    openModal(`
      <h3>Новый счёт</h3>
      <div class="form-field">
        <label for="accName">Название счёта</label>
        <input id="accName" type="text" maxlength="40" placeholder="Например, Кредитная карта">
      </div>
      <div class="form-field">
        <label for="accBalance">Начальный баланс, ₽</label>
        <input id="accBalance" type="number" min="0" step="1" placeholder="0">
      </div>
      <div class="form-actions">
        <button class="btn-ghost" id="cancelBtn">Отмена</button>
        <button class="btn-submit" id="submitBtn">Добавить</button>
      </div>
    `, (m) => {
      m.querySelector("#cancelBtn").addEventListener("click", closeModal);
      m.querySelector("#submitBtn").addEventListener("click", () => {
        const name = m.querySelector("#accName").value.trim();
        const balance = parseFloat(m.querySelector("#accBalance").value) || 0;
        if (!name) return;
        state.accounts.push({ id: nextAccountId++, name, balance });
        closeModal();
        render();
      });
    });
  });

  document.getElementById("openAddTx").addEventListener("click", () => {
    openModal(`
      <h3>Новая операция</h3>
      <div class="form-field">
        <label for="txType">Тип</label>
        <select id="txType">
          <option value="income">Доход</option>
          <option value="expense">Расход</option>
        </select>
      </div>
      <div class="form-field">
        <label for="txDesc">Описание</label>
        <input id="txDesc" type="text" maxlength="40" placeholder="Например, Продукты">
      </div>
      <div class="form-field">
        <label for="txAmount">Сумма, ₽</label>
        <input id="txAmount" type="number" min="0" step="1" placeholder="0">
      </div>
      <div class="form-actions">
        <button class="btn-ghost" id="cancelBtn">Отмена</button>
        <button class="btn-submit" id="submitBtn">Добавить</button>
      </div>
    `, (m) => {
      m.querySelector("#cancelBtn").addEventListener("click", closeModal);
      m.querySelector("#submitBtn").addEventListener("click", () => {
        const type = m.querySelector("#txType").value;
        const desc = m.querySelector("#txDesc").value.trim() || (type === "income" ? "Доход" : "Расход");
        const amount = parseFloat(m.querySelector("#txAmount").value) || 0;
        if (amount <= 0) return;
        const date = new Date().toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit" });
        state.transactions.push({ id: nextTxId++, type, amount, desc, date });

        if (state.accounts.length > 0) {
          state.accounts[0].balance += type === "income" ? amount : -amount;
        }
        closeModal();
        render();
      });
    });
  });

  document.getElementById("openPiggy").addEventListener("click", () => {
    openModal(`
      <h3>Пополнить копилку</h3>
      <div class="form-field">
        <label for="piggyAmount">Сумма пополнения, ₽</label>
        <input id="piggyAmount" type="number" min="0" step="1" placeholder="0" autofocus>
      </div>
      <div class="form-actions">
        <button class="btn-ghost" id="cancelBtn">Отмена</button>
        <button class="btn-submit" id="submitBtn">Пополнить</button>
      </div>
    `, (m) => {
      m.querySelector("#cancelBtn").addEventListener("click", closeModal);
      m.querySelector("#submitBtn").addEventListener("click", () => {
        const amount = parseFloat(m.querySelector("#piggyAmount").value) || 0;
        if (amount <= 0) return;
        state.piggy.current = Math.min(state.piggy.goal, state.piggy.current + amount);
        closeModal();
        render();
      });
    });
  });

  render();
</script>

</body>
</html>
